<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESSALUD EN LÍNEA | Monitoreo Profesional</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul-reniec: #002e5d; 
      --rojo-gob: #e30613;
      --white: #ffffff;
      --bg-body: #cfd8dc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-body);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* CABECERA */
    .header {
      background: var(--azul-reniec);
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      border-bottom: 4px solid var(--rojo-gob);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 1100;
      color: var(--white);
    }

    .header-left { display: flex; align-items: center; gap: 20px; }
    .logo-text { font-weight: 900; font-size: 1.6rem; text-transform: uppercase; }
    .header-divider { width: 1px; height: 30px; background: rgba(255,255,255,0.3); margin: 0 15px; }
    .header-title h1 { font-size: 1.1rem; font-weight: 700; text-transform: uppercase; opacity: 0.9; }

    /* RELOJ BLANCO */
    .header-right { display: flex; align-items: center; gap: 25px; }
    .clock-box { text-align: right; border-left: 1px solid rgba(255,255,255,0.3); padding-left: 20px; }
    #currentTime { font-size: 2rem; font-weight: 400; color: var(--white); display: block; line-height: 1; }
    #currentDate { font-size: 0.7rem; color: var(--white); text-transform: uppercase; font-weight: 700; margin-top: 4px; opacity: 0.8; }

    /* CONTENEDOR DE VISORES */
    .visor-container { flex: 1; padding: 12px; position: relative; overflow: hidden; }
    
    /* GRID DINÁMICO */
    .visor {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(30%, 1fr));
      gap: 12px;
      height: 100%;
      width: 100%;
    }

    .cuadro {
      background: white;
      border: 1px solid var(--azul-reniec);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* ESTADO MAXIMIZADO */
    .cuadro.maximized {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 2000;
      width: calc(100% - 24px);
      height: calc(100% - 24px);
    }

    /* TITULOS CENTRALIZADOS */
    .titulo-panel {
      background: var(--azul-reniec);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      min-height: 35px;
      position: relative;
    }

    .titulo-panel span {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--white);
      text-transform: uppercase;
      margin: 0 auto; /* Centra el texto */
    }

    /* BOTONES ACCIÓN */
    .panel-actions {
      position: absolute;
      right: 10px;
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 0.8rem;
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:hover { background: rgba(255,255,255,0.4); }

    .contenido-iframe { flex: 1; background: #fff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }

    /* BOTÓN AÑADIR VISTA */
    .add-panel-disabled {
      border: 2px dashed #90a4ae;
      background: rgba(255,255,255,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #78909c;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <div class="logo-text">EsSalud</div>
      <div class="header-divider"></div>
      <div class="header-title"><h1>MONITOREO EN TIEMPO REAL</h1></div>
    </div>
    <div class="header-right">
      <button onclick="location.reload()" style="padding: 5px 10px; cursor: pointer; border-radius: 4px; border:none; font-weight:bold; font-size:10px; margin-right:15px;">REINICIAR TODO</button>
      <div class="clock-box">
        <span id="currentTime">00:00:00</span>
        <span id="currentDate">MARTES, 10 DE MARZO DE 2026</span>
      </div>
    </div>
  </header>

  <div class="visor-container">
    <div class="visor" id="visorGrid">
      <script>
        const urlAsterisk = "http://172.20.60.10:8080/TContactaUno/faces/queues/MonitoreoPerl.xhtml";
        const paneles = [
          "OPCION 1 - CITAS", "OPCION 2 - REFERENCIA", "OPCION 3 - INFORME",
          "OPCION 4 - PACIENTES CRÓNICOS", "OPCION 5 - RECLAMO", "OPCION 1.3 - REBAGLIATI",
          "ANEXOS EXTENDIDOS", "INTERCULTURAL"
        ];

        paneles.forEach((titulo, index) => {
          document.write(`
            <div class="cuadro" id="panel-${index}">
              <div class="titulo-panel">
                <span>${titulo}</span>
                <div class="panel-actions">
                  <button class="btn-action" onclick="toggleMaximize('panel-${index}')" title="Maximizar">▢</button>
                  <button class="btn-action" onclick="closePanel('panel-${index}')" title="Cerrar">✕</button>
                </div>
              </div>
              <div class="contenido-iframe"><iframe src="${urlAsterisk}"></iframe></div>
            </div>
          `);
        });
      </script>

      <div class="cuadro add-panel-disabled" id="add-btn">
        <div style="font-size: 3rem;">+</div>
        <div style="font-size: 0.8rem; font-weight: 700;">AÑADIR VISTA</div>
      </div>
    </div>
  </div>

  <script>
    function updateDateTime() {
      const now = new Date();
      document.getElementById('currentTime').innerText = now.toLocaleTimeString('es-PE', {hour12:false});
      const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('currentDate').innerText = now.toLocaleDateString('es-PE', options).toUpperCase();
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    function toggleMaximize(panelId) {
      const panel = document.getElementById(panelId);
      panel.classList.toggle('maximized');
    }

    function closePanel(panelId) {
      const panel = document.getElementById(panelId);
      panel.style.display = 'none';
      // Al cerrar, el grid se ajusta automáticamente gracias a repeat(auto-fit)
    }
  </script>
</body>
</html>
